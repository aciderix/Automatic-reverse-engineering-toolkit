# Corpus wall sweep in CI — the breadth coverage MAP (doc 70 §5.0 / doc 90).
#
# `aret --mode walls` over a corpus of real PE32 binaries, aggregated by
# bench/wallsweep.sh, ranks the coverage gaps by how many DISTINCT binaries each
# blocks — so the next fix is chosen by data, not intuition. This is a MEASUREMENT,
# never a gate: `--mode walls` enumerates statically-decidable gaps (unmodelled
# instructions, unimplemented imports, unresolved calls), it does NOT certify
# behaviour (a miscompile is invisible to it). So this job is always green and just
# publishes the ranked map; every fix it motivates is still proven by the differential
# oracles (oracles-linux.yml). Kept a SEPARATE workflow from the gates so its long,
# corpus-sized run never blocks or bloats the oracle gate.
name: walls

on:
  workflow_dispatch:
    inputs:
      n_packages:
        description: 'How many MSYS2 packages to sample into the corpus (breadth vs time).'
        default: '600'
  schedule:
    - cron: '41 4 * * *'   # nightly, offset off the hour
  push:
    paths:
      - '.github/workflows/walls.yml'
      # The corpus fetch script is an input to the sweep (it decides which PE32 binaries
      # are gathered); a change to it must re-run the map so it is measured, not just nightly.
      - 'bench/wallcorpus_fetch.sh'

permissions:
  contents: read
  packages: read

concurrency:
  group: walls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/aciderix/aret-ci-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # 90 min protects the COLD run (first fetch of ~600 packages + first analysis of the
    # whole corpus). Both the corpus and the per-binary maps are cached, so steady-state
    # runs are fast; a cold run that still overruns just publishes a best-effort partial map.
    timeout-minutes: 90
    env:
      # NPKG=600 -> ~1800 PE32 analyzed (measured: run #3 = 1828 binaries, ~43min cold,
      # under the 90min timeout; then corpus + per-binary maps are cached so later runs only
      # re-analyze on a code change). A minority (~90) are giant C++/LLVM/Qt libraries
      # (libpython, Qt5Qml, obj2yaml, libassimp, ...) whose STATIC analysis blows the
      # per-binary 60s/3.5GB cap and fails CLEANLY — cosmetic log noise, by design, and
      # themselves a finding ("too complex to statically map in 60s"). The other ~1800
      # analyze fine, which is the breadth map's point. Overridable via the dispatch input.
      NPKG: ${{ github.event.inputs.n_packages || '600' }}
      WALLSWEEP_TIMEOUT: '60'        # per-binary wall-clock cap (s)
      CORPUS_DIR: ${{ github.workspace }}/.wallcorpus
      # Symbols the GNU C++ runtime provides — ARET lifts libstdc++/libgcc (the
      # lift_libstdcxx gate proves it end-to-end), so treating these as lift-provided is
      # TRUE, not masking: it yields the POST-LIFT wall (what a binary still needs once the
      # runtime is lifted beside it). Kept PRECISE — std:: (ZSt/ZNSt/ZNKSt/ZNSs), operator
      # new/delete (Znw/Zna/Zdl/Zda), __cxa_*/_Unwind_*, std typeinfo (ZT*St), dynamic_cast
      # — so app/C++ libraries (Qt ZN..Q.., Cap'n Proto ZN2kj..) stay VISIBLE as real walls.
      WALLSWEEP_COVERED: '^(ZSt|ZNSt|ZNKSt|ZNSs|ZNKSs|Znw|Zna|Zdl|Zda|cxa_|Unwind_|ZTVSt|ZTISt|ZTSSt)|^dynamic_cast$'
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build aret (release, locked)
        run: cargo build --release --locked

      # The PE32 corpus is fetched from MSYS2 (not committed; the fetch script is the
      # reproducible artifact) and cached. The key carries NPKG + the fetch script so a
      # different breadth or an updated fetcher rotates it; content is inherently best-effort
      # (MSYS2 moves), hence restore-keys. A fetch blip just yields a smaller corpus.
      - name: Corpus cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CORPUS_DIR }}
          key: wallcorpus-${{ runner.os }}-${{ hashFiles('bench/wallcorpus_fetch.sh') }}-${{ env.NPKG }}
          restore-keys: wallcorpus-${{ runner.os }}-
      - name: Fetch PE32 corpus (idempotent, best-effort)
        run: bash bench/wallcorpus_fetch.sh "$CORPUS_DIR" "$NPKG" || echo "::warning::wallcorpus fetch incomplete — sweeping what was gathered"

      # Persist the per-binary .walls maps across runs (WALLSWEEP_KEEP); key on the
      # HLE/runtime + lockfile so a code change re-analyses. Re-aggregation is then cheap.
      - name: Wall-map cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.wallmaps
          key: wallmaps-${{ runner.os }}-${{ hashFiles('runtime/**', 'src/**', 'Cargo.lock') }}
          restore-keys: wallmaps-${{ runner.os }}-

      - name: Sweep (measurement, never a gate)
        run: |
          mkdir -p "$CORPUS_DIR/pe32"
          n=$(find "$CORPUS_DIR/pe32" -type f 2>/dev/null | wc -l)
          echo "corpus: $n PE32 binaries"
          if [ "$n" -eq 0 ]; then
            echo "::warning::empty corpus — nothing to sweep"
            echo "empty corpus" | tee walls_raw.txt > walls_postlift.txt; exit 0
          fi
          # RAW map — generates and KEEPS the per-binary .walls maps.
          WALLSWEEP_KEEP="$GITHUB_WORKSPACE/.wallmaps" bash bench/wallsweep.sh "$CORPUS_DIR/pe32" | tee walls_raw.txt || true
          # POST-LIFT map — re-aggregate the SAME cached maps with the GNU C++ runtime treated
          # as lift-provided (instant, no re-analysis). This is the actionable view: the import
          # gaps that remain once ARET lifts the C++ runtime beside the binary.
          WALLSWEEP_KEEP="$GITHUB_WORKSPACE/.wallmaps" WALLSWEEP_COVERED="$WALLSWEEP_COVERED" \
            bash bench/wallsweep.sh "$CORPUS_DIR/pe32" | tee walls_postlift.txt || true

      - name: Publish the wall map
        if: always()
        run: |
          {
            echo "## ARET wall sweep (coverage map — not a gate)"
            echo ""
            echo "> CAVEAT: the *unmodelled-instructions* ranking is contaminated by recovery"
            echo "> false-starts landing in string/data (opcodes 0x60-0x6F etc. = ASCII bytes"
            echo "> decoded as \`outsb\`/\`popad\`/\`arpl\`/\`daa\`…). Those regions abort safely in a"
            echo "> real transpile; prioritise from the POST-LIFT imports below, not the raw"
            echo "> instruction counts. See CORE-0063 (recovery false-starts, separate task)."
            echo ""
            echo "### POST-LIFT wall (C++ runtime lift-provided) — the actionable view"
            echo '```'
            sed -n '1,50p' walls_postlift.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo "<details><summary>Raw map (pre-lift, includes runtime ARET already handles)</summary>"
            echo ""
            echo '```'
            sed -n '1,50p' walls_raw.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload wall maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-sweep
          path: |
            walls_raw.txt
            walls_postlift.txt
          if-no-files-found: warn
