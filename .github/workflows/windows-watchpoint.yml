# A REAL Windows data watchpoint, to find the writer of a memory location that our
# transpiled binary leaves untouched (doc 71, the WinMerge 0x10 wall).
#
# WHY THIS EXISTS. The diagnosis narrowed the wall to a single fact: a lazily-created
# MFC object at [0x51efd0+0xc] is written under real Windows/Wine but never under ARET
# (its create path is guarded by a condition false on our side). To fix it we need to
# see WHICH function writes that field on a real system, and under what condition.
# That is a hardware data breakpoint ("ba w4 <addr>") — and in the Linux sandbox every
# Wine debugging route fails: the gdb stub ignores hardware watchpoints, software ones
# and native winedbg hang. A real windows-latest runner has cdb and real debug
# registers, so the watchpoint just works. Same philosophy as windows-oracle.yml: use
# a real Windows to measure what Wine cannot.
#
# The target has NO ASLR (DllCharacteristics lacks DYNAMICBASE), so 0x51efdc is the
# real runtime address — the exact one from the static analysis. The binary is pinned
# by sha256 so the addresses in the captured stack map 1:1 onto our disassembly.
name: windows-watchpoint

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-watchpoint.yml'

jobs:
  watchpoint:
    runs-on: windows-latest
    steps:
      - name: Fetch WinMerge 2.14.0 portable (pinned by sha256)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # curl.exe -L follows SourceForge's mirror redirects reliably where
          # Invoke-WebRequest stops on them. The portable zip carries WinMergeU.exe;
          # the VC90 runtime it needs is installed in the next step.
          curl.exe -L --fail --max-time 120 -o wm.zip `
            'https://master.dl.sourceforge.net/project/winmerge/stable/2.14.0/WinMerge-2.14.0-exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'download failed' }
          Expand-Archive -Path wm.zip -DestinationPath wm -Force
          $exe = Get-ChildItem -Path wm -Recurse -Filter WinMergeU.exe | Select-Object -First 1
          if (-not $exe) { throw 'WinMergeU.exe not found in archive' }
          "WM_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $h = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          Write-Host "WinMergeU.exe sha256 = $h"
          # The address analysis was done against exactly this build. A mismatch means
          # the addresses would be wrong, so fail loudly rather than measure the wrong
          # binary (doc 70 section 7: qualify what you measure before drawing a cause).
          $want = 'cb886017f996154becdbbaaa34548d18db209a1c25dbd518c8f13dc3411a6a6e'
          if ($h -ne $want) { throw "sha256 mismatch: got $h want $want" }

      - name: Install the VC++ 2008 (VC90) runtime WinMerge needs
        shell: pwsh
        run: |
          # WinMerge 2.14.0 links mfc90u/msvcr90/msvcp90 as SxS assemblies; the portable
          # zip does not bundle them, so install the redistributable. The watched
          # address 0x51efdc is inside WinMergeU.exe itself (no ASLR), so the runtime
          # version does not affect it — the DLLs only need to be present so the exe runs.
          choco install vcredist2008 -y --no-progress 2>&1 | Select-Object -Last 5

      - name: Locate cdb (Windows SDK debugger)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cand = @(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x86\cdb.exe',
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          )
          $cdb = $cand | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) {
            choco install windbg -y --no-progress | Out-Null
            $cdb = (Get-ChildItem 'C:\Program Files*' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
                    Select-Object -First 1).FullName
          }
          if (-not $cdb) { throw 'cdb.exe not found' }
          Write-Host "cdb = $cdb"
          "CDB=$cdb" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Break at the writer 0x42e8fa (the field store, gated on esi=0x51efd0)
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # LESSON from run #2 (doc 71, 2026-08-02): a HARDWARE watchpoint (`ba w4`) set at
          # the initial ntdll loader break is UNRELIABLE -- the debug registers are reset
          # when the process's threads spin up, so it silently watches nothing and the step
          # just times out. And WinMerge with no argument idles in its message loop.
          #
          # The field is written by a GLOBAL _initterm constructor at STARTUP (0x51ef18 is a
          # _initterm-table entry; its member subobject 0x51efd0's ctor 0x42e884 stores the
          # field at 0x42e8fa). So a SOFTWARE breakpoint on the exact writer instruction
          # 0x42e8fa (no ASLR => runtime addr == static addr) fires within seconds of launch,
          # before any GUI idle. We gate it on esi=0x51efd0 (the ctor may build other
          # instances of the same class) and, when it hits, dump eax (the value being stored
          # = the operator-new'd sub-object), the field, and the call stack = the writer.
          #   bp 0x42e884  ".echo ===CTOR-ENTER===; r ecx; g"   (log each entry with this=ecx)
          #   bp 0x42e8fa  gated on esi==0x51efd0: dump eax/esi, the field, the stack, quit
          #   g            run to the breakpoints
          $store = 'bp 0x42e8fa "j (@esi=0x51efd0) ''.echo ===STORE===; r eax,esi; .echo --field--; dd 0x51efd0 L4; .echo --stack--; kb 16; q''; ''g''"'
          $enter = 'bp 0x42e884 ".echo ===CTOR-ENTER this=; r ecx; g"'
          $cmd = "$store; $enter; g"
          Push-Location "$env:WM_DIR"
          & "$env:CDB" -c $cmd WinMergeU.exe 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\watchpoint.txt"
          Pop-Location
          Write-Host "----- tail -----"
          Get-Content "$env:GITHUB_WORKSPACE\watchpoint.txt" | Select-Object -Last 70

      - name: Publish the writer stack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-watchpoint
          path: watchpoint.txt
