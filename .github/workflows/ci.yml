name: regression gate

# Runs the unified north-star gate (roadmap §10) on every push / PR: build +
# unit tests + the three verification levels (recompile, differential, SMT) +
# the exhaustive magic-division proof. A red gate means a real regression.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Z3 (SMT level 3)
        run: sudo apt-get update && sudo apt-get install -y z3

      # gcc, gzip, ls, cat are present on ubuntu-latest, so SKIP_SYSBINS stays off
      # and the recompilability level runs against the real system binaries.
      - name: Regression gate
        run: bash bench/regression.sh
